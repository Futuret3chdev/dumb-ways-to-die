<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dumb Ways to Die</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: #87CEEB;
            display: block;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        button {
            position: absolute;
            z-index: 20;
            padding: 15px 30px;
            font-size: 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        #startBtn {
            top: 40%;
        }
        #fullscreenBtn {
            top: 10px;
            right: 10px;
        }
        #songBtn {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>High Score: <span id="highScore">0</span></div>
        </div>
        <button id="startBtn">START GAME</button>
        <button id="fullscreenBtn">FULLSCREEN</button>
        <button id="songBtn">🎵 Play Song</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let gameRunning = false;
        let score = 0;
        let highScore = localStorage.getItem('dumbHighScore') || 0;
        document.getElementById('highScore').textContent = highScore;

        // Player
        let player = { x: 400, y: 500, size: 40, speed: 8 };

        // Obstacles
        let obstacles = [];
        let particles = [];

        // Controls
        let mouseX = player.x;
        let isTouching = false;

        // Audio
        let audio = null;
        let songPlaying = false;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const aspect = 800 / 600;
            let width = window.innerWidth;
            let height = window.innerHeight * 0.9;
            if (width / height > aspect) {
                width = height * aspect;
            } else {
                height = width / aspect;
            }
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = 800;
            canvas.height = 600;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Draw player (dumb green bean)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            // Body
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.ellipse(0, 0, player.size/2, player.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(-12, -10, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(12, -10, 8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(-12, -10, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(12, -10, 4, 0, Math.PI*2); ctx.fill();
            // Mouth
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 5, 10, 0.2, Math.PI - 0.2);
            ctx.stroke();
            ctx.restore();
        }

        // Draw obstacles (dumb ways)
        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            if (obs.type === 'train') {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-30, -15, 60, 30);
            } else if (obs.type === 'bear') {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
            } else if (obs.type === 'fire') {
                ctx.fillStyle = '#ff8800';
                ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function createObstacle() {
            const types = ['train', 'bear', 'fire', 'piranha'];
            const type = types[Math.floor(Math.random() * types.length)];
            obstacles.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -50,
                size: 40,
                speed: 3 + Math.random() * 4 + score / 500,
                type: type
            });
        }

        function createParticles(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.random() * 10 - 5,
                    vy: Math.random() * 10 - 5,
                    life: 40,
                    color: `hsl(${Math.random()*60}, 100%, 50%)`
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            // Move player towards mouse/touch
            const dx = mouseX - player.x;
            player.x += dx * 0.2;
            player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, player.x));

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed;
                if (obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                    score += 10;
                }

                // Collision
                const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
                if (dist < player.size/2 + obs.size/2) {
                    endGame();
                    return;
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vy += 0.3;
                if (p.life <= 0) particles.splice(i, 1);
            }

            score += 1;
            document.getElementById('score').textContent = Math.floor(score);

            // Spawn obstacles
            if (Math.random() < 0.03 + score / 10000) createObstacle();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background elements
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

            drawPlayer();

            obstacles.forEach(obs => drawObstacle(obs));
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 40;
                ctx.fillRect(p.x, p.y, 8, 8);
            });
            ctx.globalAlpha = 1;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            gameRunning = true;
            score = 0;
            obstacles = [];
            particles = [];
            document.getElementById('startBtn').style.display = 'none';
        }

        function endGame() {
            gameRunning = false;
            createParticles(player.x, player.y);
            if (score > highScore) {
                highScore = Math.floor(score);
                localStorage.setItem('dumbHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            alert(`💀 You died in a DUMB way! Score: ${Math.floor(score)}\nHigh Score: ${highScore}\nRefresh to play again!`);
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('startBtn').textContent = 'PLAY AGAIN';
        }

        // Controls - Mouse & Touch
        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches) {
                mouseX = e.touches[0].clientX - rect.left;
            } else {
                mouseX = e.clientX - rect.left;
            }
            mouseX = mouseX * (canvas.width / rect.width); // Scale to canvas coords
        }

        canvas.addEventListener('mousemove', handleMove);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleMove(e);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleMove(e);
            isTouching = true;
        });

        // Buttons
        document.getElementById('startBtn').addEventListener('click', startGame);

        // Fullscreen
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            const container = document.getElementById('gameContainer');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            } else {
                alert("Fullscreen not supported on this device/browser. Try rotating your phone or using landscape mode!");
            }
        });

        // Song
        document.getElementById('songBtn').addEventListener('click', () => {
            if (!audio) {
                audio = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (songPlaying) {
                songPlaying = false;
                document.getElementById('songBtn').textContent = '🎵 Play Song';
            } else {
                songPlaying = true;
                document.getElementById('songBtn').textContent = '⏹️ Stop Song';
                playDumbSong();
            }
        });

        function playDumbSong() {
            if (!songPlaying) return;
            const notes = [262, 294, 330, 349, 392, 440];
            let i = 0;
            const interval = setInterval(() => {
                if (!songPlaying) {
                    clearInterval(interval);
                    return;
                }
                const osc = audio.createOscillator();
                osc.frequency.value = notes[i % notes.length];
                const gain = audio.createGain();
                osc.connect(gain).connect(audio.destination);
                osc.start();
                gain.gain.value = 0.1;
                setTimeout(() => osc.stop(), 200);
                i++;
            }, 250);
        }

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') mouseX = Math.max(0, mouseX - 50);
            if (e.key === 'ArrowRight') mouseX = Math.min(canvas.width, mouseX + 50);
            if (e.key === ' ' && !gameRunning) startGame();
        });

        // Start loop
        gameLoop();

        // Spawn
        setInterval(() => {
            if (gameRunning && Math.random() < 0.5) createObstacle();
        }, 800);
    </script>
</body>
</html>
